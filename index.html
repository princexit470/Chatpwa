<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XIT - Secure Messenger</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00e5ff">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- PWA & Permissions Fix -->
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*">
    <script src="./config.js"></script>

    <style>
        :root {
            --bg-dark: #0a0f18; --panel-bg: rgba(15, 20, 30, 0.95); --panel-solid: #121824;
            --primary: #00e5ff; --primary-glow: rgba(0, 229, 255, 0.4);
            --sent-bubble: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); --recv-bubble: #1a2233;
            --text-main: #f8fafc; --danger: #ff4757;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg-dark); color: var(--text-main); overflow: hidden; user-select: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Layout Setup */
        header { background: var(--panel-bg); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; position: fixed; width: 100%; top: 0; }
        .top-bar { display: flex; align-items: center; padding: 20px; font-weight: 800; font-size: 22px; color: var(--primary); justify-content: space-between; }
        .tabs { display: flex; width: 100%; }
        .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 14px; font-weight: 600; opacity: 0.5; border-bottom: 3px solid transparent; cursor: pointer; transition: 0.3s; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--primary); color: var(--primary); }

        .view-container { display: flex; width: 300%; height: 100%; padding-top: 115px; transition: transform 0.3s ease; }
        .view { width: 33.333%; height: 100%; overflow-y: auto; padding-bottom: 80px; }

        /* UI Elements */
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #2b3240, #141820); display: flex; align-items: center; justify-content: center; color: white; margin-right: 15px; font-weight: 800; text-transform: uppercase; border: 2px solid rgba(255,255,255,0.1); }
        .chat-row { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; }
        .chat-row:active { background: rgba(255,255,255,0.05); }

        /* Chat Window */
        #chat-window { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg-dark); z-index: 2000; display: flex; flex-direction: column; transition: 0.3s ease; }
        #chat-window.open { left: 0; }
        .chat-header { background: var(--panel-bg); padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .msg-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; position: relative; word-wrap: break-word; }
        .sent { background: var(--sent-bubble); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 600; }
        .recv { background: var(--recv-bubble); color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .input-area { background: var(--panel-bg); padding: 10px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-bottom: max(15px, env(safe-area-inset-bottom)); }
        .input-area input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 25px; padding: 14px 20px; outline: none; font-size: 16px; }
        .send-btn { background: var(--primary); color: #000; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a2233 0%, var(--bg-dark) 100%); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { width: 85%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .login-box input { padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; font-size: 16px; outline: none; }

        /* Modals & Misc */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 4000; display:none; align-items:flex-end; justify-content:center; }
        .modal-card { background: var(--panel-solid); width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s; }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-card input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color:white; border-radius: 10px; font-size: 15px; outline: none; }
        .btn-primary { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: 800; font-size: 16px; margin-top: 10px; }
        .btn-danger { background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.3); padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; margin-bottom: 10px; }
        
        .fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #11998e, #38ef7d); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 30px; border:none; z-index: 1000; box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4); }

        /* Sidebar */
        #sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel-solid); z-index: 6000; transition: 0.3s; box-shadow: 5px 0 25px rgba(0,0,0,0.8); }
        #sidebar.open { left: 0; }
        .menu-item { padding: 18px 25px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: #ccc; display: flex; align-items: center; gap: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="overlay" onclick="toggleSidebar(false)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:5999;"></div>
    <div id="sidebar">
        <div style="padding: 60px 20px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div id="my-avatar" class="avatar" style="margin: 0 auto 10px; width: 70px; height: 70px; font-size: 28px;"></div>
            <b id="side-user-info" style="font-size: 20px;"></b>
        </div>
        <div class="menu-item" onclick="installApp()">⬇️ Install App</div>
        <div class="menu-item" onclick="requestPermissions()">🔒 Allow Permissions</div>
        <div class="menu-item" style="color: var(--danger);" onclick="logout()">🚪 Logout</div>
    </div>

    <!-- Login -->
    <div id="login-screen">
        <h1 style="color:var(--primary); font-size: 50px; letter-spacing: 5px;">XIT</h1>
        <div class="login-box">
            <input type="text" id="user-input" placeholder="Username" autocomplete="off">
            <input type="password" id="pass-input" placeholder="Password">
            <button onclick="performLogin()" style="padding:15px; background:var(--primary); color:#000; border:none; border-radius:12px; font-weight:800; font-size:16px;">GET STARTED</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="top-bar">
            <span onclick="toggleSidebar(true)" style="cursor:pointer;">☰ XIT</span>
        </div>
        <div class="tabs">
            <div class="tab active" id="tab0" onclick="moveTab(0)">CHATS</div>
            <div class="tab" id="tab1" onclick="moveTab(1)">STATUS</div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="view-container" id="main-container">
        <div class="view">
            <div id="chat-list"></div>
        </div>
        <div class="view" id="status-list"></div>
    </div>

    <button class="fab" onclick="handleFab()">+</button>

    <!-- Chat Window -->
    <div id="chat-window">
        <div class="chat-header">
            <span onclick="closeChat()" style="font-size:26px; cursor:pointer; padding-right:10px;">←</span>
            <b id="active-name" style="flex:1; font-size:18px;"></b>
            <span onclick="requestPermissions()" style="font-size:20px; cursor:pointer;">📞</span>
        </div>
        <div class="msg-flow" id="msg-flow"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➔</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="modal-overlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="margin-top:0;"></h3>
            <div id="modal-body"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="closeModal()" style="flex:1; padding:12px; background:rgba(255,255,255,0.1); color:white; border:none; border-radius:10px;">Cancel</button>
                <button id="modal-confirm-btn" class="btn-primary" style="flex:1; margin-top:0;">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // --- PWA Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').then(() => console.log("SW Ready"));
        }

        // --- Install Logic ---
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
        function installApp() {
            if (!deferredPrompt) return alert('Browser menu se "Add to Home Screen" par click karein.');
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(c => { if(c.outcome === 'accepted') alert('Installed!'); });
            deferredPrompt = null;
        }

        // --- Permission Logic ---
        async function requestPermissions() {
            try {
                if (Notification.permission !== "granted") await Notification.requestPermission();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                stream.getTracks().forEach(t => t.stop());
                alert("Permissions Granted Successfully!");
            } catch(e) { alert("Permission Denied. Please allow from browser settings."); }
        }

        // --- Firebase Setup ---
        firebase.initializeApp(window.XIT_FIREBASE_CONFIG);
        const db = firebase.database();
        let myUser = localStorage.getItem('xit_username');
        let activeRoom = null, activePeer = null;

        // --- Navigation & Back Button Fix ---
        window.addEventListener('popstate', function(e) {
            if (document.getElementById('sidebar').classList.contains('open')) {
                toggleSidebar(false);
            } else if (document.getElementById('modal-container').classList.contains('active')) {
                closeModal();
            } else if (document.getElementById('chat-window').classList.contains('open')) {
                closeChat(false);
            } else {
                // App band hone se bachane ke liye state maintain rakho
                history.pushState({page: 'home'}, "");
            }
        });

        if(!myUser) history.replaceState({page: 'login'}, "");
        else history.replaceState({page: 'home'}, "");

        // --- Login System ---
        async function performLogin() {
            const name = document.getElementById('user-input').value.trim().toLowerCase();
            const pass = document.getElementById('pass-input').value.trim();
            if(!name || !pass) return alert("Enter details");
            
            requestPermissions(); // Login hote hi permission maango

            const snap = await db.ref('users/'+name).once('value');
            if(snap.exists() && snap.val().password !== pass) return alert("Wrong Password");
            if(!snap.exists()) await db.ref('users/'+name).set({password: pass});
            
            localStorage.setItem('xit_username', name); location.reload();
        }
        function logout() { localStorage.clear(); location.reload(); }

        // --- Sidebar ---
        function toggleSidebar(open) {
            document.getElementById('sidebar').classList.toggle('open', open);
            document.getElementById('overlay').style.display = open ? 'block' : 'none';
        }

        // --- Tabs ---
        function moveTab(i) {
            document.getElementById('main-container').style.transform = `translateX(-${i * 33.333}%)`;
            document.getElementById('tab0').classList.toggle('active', i === 0);
            document.getElementById('tab1').classList.toggle('active', i === 1);
        }

        // --- App Logic ---
        function startApp() {
            document.getElementById('side-user-info').innerText = "@" + myUser;
            document.getElementById('my-avatar').innerText = myUser[0];

            db.ref('users').on('value', snap => {
                const list = document.getElementById('chat-list'); list.innerHTML = "";
                snap.forEach(user => {
                    if(user.key !== myUser) {
                        list.innerHTML += `
                            <div class="chat-row" onclick="openChat('${user.key}')">
                                <div class="avatar">${user.key[0]}</div>
                                <div style="flex:1;"><b>${user.key}</b></div>
                            </div>`;
                    }
                });
            });
        }

        function openChat(peer) {
            activeRoom = [myUser, peer].sort().join('_');
            activePeer = peer;
            document.getElementById('active-name').innerText = peer;
            document.getElementById('chat-window').classList.add('open');
            history.pushState({page: 'chat'}, "");

            db.ref('messages/'+activeRoom).on('value', snap => {
                const flow = document.getElementById('msg-flow'); flow.innerHTML = "";
                snap.forEach(msg => {
                    const m = msg.val();
                    flow.innerHTML += `<div class="bubble ${m.from === myUser ? 'sent' : 'recv'}">${m.text}</div>`;
                });
                flow.scrollTop = flow.scrollHeight;
            });
        }

        function closeChat(back=true) {
            document.getElementById('chat-window').classList.remove('open');
            if(activeRoom) db.ref('messages/'+activeRoom).off();
            activeRoom = null;
            if(back) history.back();
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const txt = input.value.trim();
            if(!txt || !activeRoom) return;
            db.ref('messages/'+activeRoom).push({ from: myUser, text: txt, ts: Date.now() });
            input.value = "";
        }

        // --- Modals ---
        function handleFab() {
            document.getElementById('modal-title').innerText = "New Chat";
            document.getElementById('modal-body').innerHTML = `<input id="new-chat-user" placeholder="Enter exact username">`;
            document.getElementById('modal-confirm-btn').onclick = () => {
                const u = document.getElementById('new-chat-user').value.toLowerCase().trim();
                if(u) { closeModal(); openChat(u); }
            };
            document.getElementById('modal-container').classList.add('active');
        }
        function closeModal() { document.getElementById('modal-container').classList.remove('active'); }

        // --- Boot ---
        if(!myUser) document.getElementById('login-screen').style.display = 'flex';
        else startApp();

    </script>
</body>
</html>
