<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XIT - MADE BY PRINCE</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00e5ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f18; --panel-bg: rgba(15, 20, 30, 0.85); --panel-solid: #121824;
            --primary: #00e5ff; --primary-glow: rgba(0, 229, 255, 0.4);
            --sent-bubble: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); --recv-bubble: #1a2233;
            --text-main: #f8fafc; --danger: #ff4757; --blur: blur(15px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg-dark); color: var(--text-main); overflow: hidden; user-select: none; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); backdrop-filter: var(--blur); z-index: 9000; display:none; align-items:flex-end; justify-content:center; transition: opacity 0.3s; cursor: pointer; }
        .modal-card { background: var(--panel-solid); width: 100%; max-width: 600px; border-radius: 25px 25px 0 0; padding: 25px 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); cursor: default; max-height: 85vh; overflow-y: auto; margin: 0 auto; border-top: 1px solid rgba(255,255,255,0.05); }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-card input, .modal-card select, .modal-card textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color:white; border-radius: 12px; outline: none; transition: 0.3s; font-size:15px; }
        .modal-card input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        /* Call Alert */
        .premium-call-alert { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: rgba(5, 8, 15, 0.95) !important; backdrop-filter: blur(20px); z-index: 2147483647 !important; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .premium-call-card { background: #111622; border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 30px; width: 90%; max-width: 400px; padding: 40px 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); animation: popIn 0.5s ease; }
        .pulse-avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 25px; }
        .pulse-avatar-bg { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, #00e5ff, #11998e); border-radius: 50%; animation: pulseGlow 2s infinite; opacity: 0.2; }
        .pulse-avatar-main { position: relative; width: 100%; height: 100%; border-radius: 50%; background: #1a2333; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 800; color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .premium-call-actions { display: flex; gap: 15px; width: 100%; margin-top: 35px; }
        .p-call-btn { flex: 1; padding: 18px; border: none; border-radius: 18px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .p-call-decline { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); color: white; }
        .p-call-accept { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: #000; }

        button { cursor: pointer; transition: 0.2s; font-family: 'Outfit'; }
        button:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%); color: #000; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; font-size: 16px; margin-bottom: 10px; }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; width: 100%; font-weight: 600; font-size: 15px; margin-bottom: 10px; }
        .btn-danger { background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.3); padding: 15px; border-radius: 12px; width: 100%; font-weight: 600; margin-bottom: 10px; }

        header { background: var(--panel-bg); backdrop-filter: var(--blur); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; position: relative; }
        .top-bar { display: flex; align-items: center; padding: 20px; gap: 15px; font-weight: 800; font-size: 22px; color: var(--primary); }
        .tabs { display: flex; }
        .tab { flex: 1; padding: 15px 0; text-align: center; font-size: 14px; font-weight: 600; opacity: 0.5; border-bottom: 3px solid transparent; color: white; cursor: pointer; transition: 0.3s; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--primary); color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .view-container { display: flex; width: 300%; height: calc(100% - 120px); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); }
        .view { width: 33.333%; height: 100%; overflow-y: auto; padding-bottom: 90px; }

        #sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel-solid); z-index: 2000; transition: 0.3s; box-shadow: 5px 0 25px rgba(0,0,0,0.8); overflow-y: auto; }
        #sidebar.open { left: 0; }
        .sidebar-header { background: linear-gradient(180deg, rgba(0,229,255,0.1) 0%, transparent 100%); padding: 60px 20px 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header .avatar { margin: 0 auto 15px; width: 80px; height: 80px; font-size: 32px; border: 2px solid var(--primary); }
        .menu-item { padding: 18px 25px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; color: #aaa; font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 15px; }
        .menu-item:hover { background: rgba(255,255,255,0.03); color: white; padding-left: 30px; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: var(--blur); z-index: 1900; }

        #chat-window { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg-dark); z-index: 1500; display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); }
        #chat-window.open { left: 0; }
        .chat-header { background: var(--panel-bg); backdrop-filter: var(--blur); padding: 12px 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .icon-btn { background: transparent; border: none; fill: var(--primary); width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-btn svg { width: 22px; height: 22px; }
        
        .msg-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg-wrapper { display:flex; align-items:center; width:100%; position:relative; overflow: hidden; flex-shrink: 0;}
        .sent-wrap { justify-content:flex-end; } .recv-wrap { justify-content:flex-start; }
        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 15px; position: relative; word-wrap: break-word; white-space: pre-wrap; animation: popIn 0.2s ease forwards; }
        .bubble img, .bubble video { width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; }
        .bubble audio { width: 100%; min-width: 200px; margin-top:5px; height: 40px; }
        .msg-time { font-size: 10px; margin-top: 8px; text-align: right; opacity: 0.6; }
        .sent { background: var(--sent-bubble); color: white; border-bottom-right-radius: 4px; }
        .recv { background: var(--recv-bubble); color: white; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

        #chat-input-bar { background: var(--panel-bg); backdrop-filter: var(--blur); border-top: 1px solid rgba(255,255,255,0.05); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        #chat-input-row { padding: 12px 15px; display: flex; gap: 12px; align-items: center; }
        #msg-input { flex:1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 25px; padding: 14px 20px; font-size: 15px; outline: none; }
        .send-btn { background: var(--primary); color: #000; border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .mic-btn { background: rgba(0, 229, 255, 0.1); color: var(--primary); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .mic-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .mic-btn.recording { background: var(--danger); color: white; animation: pulseRecord 1.5s infinite; }

        .chat-row, .status-row, .req-row, .history-row { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; }
        .chat-row.unread { background: linear-gradient(90deg, rgba(0,229,255,0.08) 0%, rgba(10,15,24,0.4) 100%); border-left: 4px solid var(--primary); }
        .avatar { width: 55px; height: 55px; border-radius: 18px; background: linear-gradient(135deg, #2b3240, #141820); display: flex; align-items: center; justify-content: center; color: white; margin-right: 15px; font-weight: 800; font-size: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: linear-gradient(135deg, #11998e, #38ef7d); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 28px; border:none; z-index: 90; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a2233 0%, var(--bg-dark) 100%); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #login-screen h1 { font-size: 60px; color: var(--primary); margin-bottom: 50px; font-weight: 800; }

        #call-screen { position:fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index:9999; display:none; flex-direction:column; color:white; }
        #remote-video { width:100%; height:100%; object-fit:cover; background:#000; display:none; }
        #local-video { position:absolute; bottom:140px; right:20px; width:110px; height:160px; object-fit:cover; border-radius:15px; border:2px solid var(--primary); display:none; transform: scaleX(-1); }
        .audio-avatar-wrapper { display:none; flex-direction:column; align-items:center; justify-content:center; height:100%; position:absolute; top:0; left:0; width:100%; }
        .audio-avatar { width: 180px; height: 180px; border-radius: 50%; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 70px; color: var(--primary); animation: pulseGlow 2s infinite; }
        .call-controls { position:absolute; bottom:30px; width:100%; display:flex; justify-content:center; gap:20px; z-index:11; }
        .call-btn { width:65px; height:65px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.1); color: white; }
        .call-btn.end { background: #ff4757; width: 75px; height: 75px; }
        
        #install-banner { position: fixed; bottom: 100px; left: 20px; right: 20px; background: linear-gradient(135deg, #00e5ff, #11998e); color: #000; padding: 15px 20px; border-radius: 15px; display: none; align-items: center; gap: 15px; z-index: 800; }
        #install-banner button { background: #000; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); } 50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.6); } 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); } }
        @keyframes pulseRecord { 0% { box-shadow: 0 0 10px rgba(255,71,87,0.4); } 50% { box-shadow: 0 0 25px rgba(255,71,87,0.8); } 100% { box-shadow: 0 0 10px rgba(255,71,87,0.4); } }
    </style>
</head>
<body>

    <audio id="ringtone-audio" loop src="https://assets.mixkit.co/active_storage/sfx/1357/1357-preview.mp3"></audio>

    <div id="install-banner">
        <span style="font-size: 24px;">📱</span>
        <b style="flex:1;">XIT Install karein</b>
        <button onclick="installApp()">Install</button>
        <button onclick="document.getElementById('install-banner').style.display='none'" style="background:transparent; color:#000; font-size:24px; padding:0 5px;">×</button>
    </div>

    <div id="premium-call-layer" class="premium-call-alert">
        <div class="premium-call-card">
            <div class="pulse-avatar-container">
                <div class="pulse-avatar-bg"></div>
                <div id="p-call-avatar" class="pulse-avatar-main">-</div>
            </div>
            <h2 id="p-call-username" style="margin: 0 0 8px; font-size: 26px;">User</h2>
            <p id="p-call-type" style="margin: 0 0 5px; color: var(--primary); font-size: 14px;">INCOMING CALL</p>
            <div class="premium-call-actions">
                <button class="p-call-btn p-call-decline" onclick="rejectCall()">Decline</button>
                <button class="p-call-btn p-call-accept" onclick="answerCall()">Accept</button>
            </div>
        </div>
    </div>

    <div id="modal-container" class="modal-overlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="margin-top:0; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);"></h3>
            <div id="modal-body"></div>
            <div class="modal-btns" id="modal-btns-wrapper" style="display:flex; justify-content:flex-end; gap:12px; margin-top:25px;">
                <button onclick="closeModal()" style="background:rgba(255,255,255,0.1); color:white; padding:12px 25px; border-radius:12px;">Cancel</button>
                <button id="modal-confirm-btn" style="background:var(--primary); color:#000; padding:12px 25px; border-radius:12px;">Confirm</button>
            </div>
        </div>
    </div>

    <div id="call-screen">
        <div style="position:absolute; top:50px; width:100%; text-align:center; font-size:24px; z-index:10;" id="call-status-text">Calling...</div>
        <div style="position:absolute; top:90px; width:100%; text-align:center; font-size:18px; z-index:10;" id="call-timer-text"></div>
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <div class="audio-avatar-wrapper" id="audio-avatar-wrap">
            <div class="audio-avatar" id="audio-avatar-letter">A</div>
        </div>
        <div class="call-controls">
            <button class="call-btn" onclick="toggleMute()">🎤</button>
            <button class="call-btn" onclick="toggleVideo()">📹</button>
            <button class="call-btn end" onclick="endCall()">📞</button>
        </div>
    </div>

    <div id="login-screen">
        <h1>XIT</h1>
        <div style="width: 85%; max-width: 340px; display: flex; flex-direction: column; gap: 18px;">
            <input type="text" id="user-input" placeholder="Username" style="padding:18px; border-radius:15px; background:rgba(0,0,0,0.5); color:white;">
            <input type="password" id="pass-input" placeholder="Password" style="padding:18px; border-radius:15px; background:rgba(0,0,0,0.5); color:white;">
            <button onclick="performLogin()" style="padding:18px; background:linear-gradient(90deg, #11998e, #38ef7d); color:#000; border:none; border-radius:15px; font-weight:800;">GET STARTED</button>
        </div>
    </div>

    <div id="overlay" onclick="toggleSidebar(false)"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <div id="my-avatar" class="avatar"></div>
            <b id="side-user-info"></b>
        </div>
        <div style="padding-top:10px;">
            <div class="menu-item" onclick="showPrivateRoomMenu()">🔒 Private Rooms</div>
            <div class="menu-item" onclick="showCallHistory()">📞 Call History</div>
            <div class="menu-item" onclick="installApp()">⬇️ Install App</div>
            <div class="menu-item" style="color: var(--danger);" onclick="logout()">🚪 Logout</div>
        </div>
    </div>

    <header>
        <div class="top-bar"><span onclick="toggleSidebar(true)" style="cursor:pointer;">☰ XIT</span></div>
        <div class="tabs">
            <div class="tab active" id="tab0" onclick="moveTab(0)">CHATS</div>
            <div class="tab" id="tab1" onclick="moveTab(1)">STATUS</div>
            <div class="tab" id="tab2" onclick="moveTab(2)">REQUESTS</div>
        </div>
    </header>

    <div class="view-container" id="main-container">
        <div class="view">
            <div style="padding: 15px 20px;"><input type="text" id="search-chat-input" placeholder="Search hidden alias..." oninput="renderChatList()" style="width:100%; padding:14px 20px; border-radius:25px; background:rgba(0,0,0,0.5); color:white; border:none;"></div>
            <div id="chat-list"></div>
        </div>
        <div class="view" id="status-list"></div>
        <div class="view" id="request-list">
            <div style="padding:20px; font-weight:800; color:var(--primary);">RECEIVED</div>
            <div id="received-reqs"></div>
            <div style="padding:20px; font-weight:800; color:var(--primary);">SENT</div>
            <div id="sent-reqs"></div>
        </div>
    </div>

    <button class="fab" onclick="handleFab()">+</button>

    <div id="chat-window">
        <div class="chat-header">
            <span onclick="closeChat()" style="font-size:28px; cursor:pointer;">←</span>
            <b id="active-name" style="flex:1;"></b>
            <button class="icon-btn" id="btn-audio-call" onclick="startCall('audio')" style="display:none;">📞</button>
            <button class="icon-btn" id="btn-video-call" onclick="startCall('video')" style="display:none;">📹</button>
        </div>
        <div class="msg-flow" id="msg-flow"></div>
        <div id="chat-input-bar">
            <div id="chat-input-row">
                <label style="font-size:26px; color:#aaa;"><input type="file" id="media-input" hidden onchange="sendMedia()">📎</label>
                <input type="text" id="msg-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMsg()">
                <button class="send-btn" id="send-btn" style="display:none;" onclick="sendMsg()">➔</button>
                <button class="mic-btn" id="mic-btn" style="display:flex;">🎤</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // PWA Install Logic
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'flex';
        });
        function installApp() {
            if (!deferredPrompt) return alert('Browser menu se "Add to Home Screen" par click karein.');
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(choice => { if (choice.outcome === 'accepted') document.getElementById('install-banner').style.display = 'none'; });
            deferredPrompt = null;
        }

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').then(() => console.log("SW Registered"));
        }

        // Notification Permission
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        const firebaseConfig = {
            apiKey: "AIzaSyB6I0uj92aNft_TLwtYXhLNBi136LTYr8g",
            authDomain: "prince-a6721.firebaseapp.com",
            databaseURL: "https://prince-a6721-default-rtdb.firebaseio.com",
            projectId: "prince-a6721",
            storageBucket: "prince-a6721.firebasestorage.app",
            messagingSenderId: "320131851435",
            appId: "1:320131851435:web:fe98ec2fa7641aa41583ee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myUser = localStorage.getItem('xit_username');
        let activeRoom = null, activePeerName = null;
        let currentTab = 0;
        window.myPeers = {};
        window.cachedMessages = {}; // CACHE FIX for loading speed

        const ringtoneAudio = document.getElementById('ringtone-audio');

        function showModal(title, body, confirmFn, showBtns = true) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = body;
            document.getElementById('modal-btns-wrapper').style.display = showBtns ? 'flex' : 'none';
            if(showBtns) document.getElementById('modal-confirm-btn').onclick = confirmFn;
            document.getElementById('modal-container').classList.add('active');
        }
        function closeModal() { document.getElementById('modal-container').classList.remove('active'); }
        function toggleSidebar(o) { document.getElementById('sidebar').classList.toggle('open', o); document.getElementById('overlay').style.display = o ? 'block' : 'none'; }

        async function performLogin() {
            const name = document.getElementById('user-input').value.trim().toLowerCase();
            const pass = document.getElementById('pass-input').value.trim();
            if(!name || !pass) return;
            
            // Unmute audio on user interaction for ringtone
            ringtoneAudio.muted = false; ringtoneAudio.play().then(()=>ringtoneAudio.pause()).catch(()=>{});

            const snap = await db.ref('registered_users/'+name).once('value');
            if(snap.exists()){ if(snap.val().password === pass) login(name); else alert("Wrong Password"); }
            else { await db.ref('registered_users/'+name).set({password:pass, ts:Date.now()}); login(name); }
        }
        function login(n){ localStorage.setItem('xit_username', n); location.reload(); }
        function logout(){ localStorage.clear(); location.reload(); }

        function startApp() {
            listenForCalls();
            db.ref('peers/'+myUser).on('value', snap => { window.myPeers = snap.val() || {}; renderChatList(); });
            db.ref('requests/'+myUser).on('value', snap => renderRequests(snap.val() || {}));
        }

        function renderChatList() {
            const list = document.getElementById('chat-list'); list.innerHTML = "";
            Object.values(window.myPeers).forEach(p => {
                const row = document.createElement('div'); row.className = "chat-row"; row.id = "chat-row-"+p.room;
                row.innerHTML = `<div class="avatar">${p.peer[0]}</div><div style="flex:1;"><b>${p.peer}</b></div>`;
                row.onclick = () => openChat(p.room, p.peer);
                list.appendChild(row);
            });
        }

        // --- CHAT LOADING & CACHING FIX ---
        function openChat(room, name) {
            activeRoom = room; activePeerName = name;
            document.getElementById('active-name').innerText = name;
            document.getElementById('chat-window').classList.add('open');
            document.getElementById('btn-audio-call').style.display = 'block';
            document.getElementById('btn-video-call').style.display = 'block';

            const flow = document.getElementById('msg-flow');
            
            // 1. Instant Load from Cache (No Loading Time)
            if(window.cachedMessages[room]) {
                flow.innerHTML = window.cachedMessages[room];
            } else {
                flow.innerHTML = "<div style='text-align:center; padding:20px; color:#aaa;'>Loading messages...</div>";
            }

            // 2. Fetch from Firebase in Background
            db.ref('messages/'+room).on('value', snap => {
                if(activeRoom !== room) return;
                flow.innerHTML = "";
                if(!snap.exists()) { flow.innerHTML = "<div style='text-align:center; padding:20px; color:#555;'>No messages yet.</div>"; return; }
                
                snap.forEach(ms => {
                    const m = ms.val(); m.key = ms.key;
                    const wrap = document.createElement('div'); wrap.className = `msg-wrapper ${m.from === myUser ? 'sent-wrap' : 'recv-wrap'}`;
                    const bubble = document.createElement('div'); bubble.className = `bubble ${m.from === myUser ? 'sent' : 'recv'}`;
                    let content = '';
                    
                    if(m.type === 'image') content += `<img src="${m.data}">`;
                    else if(m.type === 'video') content += `<video src="${m.data}" controls></video>`;
                    else if(m.type === 'audio') content += `<audio src="${m.data}" controls></audio>`;
                    else content += m.data;
                    
                    content += `<div class="msg-time">${new Date(m.ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
                    bubble.innerHTML = content; wrap.appendChild(bubble); flow.appendChild(wrap);
                });
                
                // Save to Cache
                window.cachedMessages[room] = flow.innerHTML;
                setTimeout(() => { flow.scrollTop = flow.scrollHeight; }, 50);
            });
        }

        function closeChat() {
            document.getElementById('chat-window').classList.remove('open');
            if(activeRoom) db.ref('messages/'+activeRoom).off();
            activeRoom = null;
        }

        function sendMsg() {
            const inp = document.getElementById('msg-input'); const val = inp.value.trim(); if(!val) return; inp.value = "";
            db.ref('messages/'+activeRoom).push({ from: myUser, data: val, ts: Date.now() });
        }

        function sendMedia() {
            const fileInput = document.getElementById('media-input'); const file = fileInput.files[0]; if(!file) return;
            if(file.size > 4 * 1024 * 1024) return alert("File under 4MB only.");
            let fType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'audio';
            const r = new FileReader();
            r.onload = (e) => { db.ref('messages/'+activeRoom).push({ from: myUser, data: e.target.result, type: fType, ts: Date.now() }); fileInput.value = ''; };
            r.readAsDataURL(file);
        }

        // --- NOTIFICATION FIX ---
        function listenForCalls() {
            db.ref(`incoming_calls/${myUser}`).on('value', snap => {
                if(snap.exists()) {
                    let call = snap.val();
                    ringtoneAudio.play().catch(()=>{});
                    document.getElementById('premium-call-layer').style.display = 'flex';
                    document.getElementById('p-call-username').innerText = call.caller;
                    document.getElementById('p-call-avatar').innerText = call.caller[0].toUpperCase();
                    document.getElementById('p-call-type').innerText = `INCOMING ${call.type.toUpperCase()} CALL`;

                    // Device Notification for Call (when background)
                    if (Notification.permission === "granted" && document.hidden) {
                        new Notification(`Incoming ${call.type} call`, { body: `Call from ${call.caller}`, icon: './icon-192.png' });
                    }
                } else {
                    ringtoneAudio.pause();
                    document.getElementById('premium-call-layer').style.display = 'none';
                }
            });
        }

        function answerCall() { alert("Call feature requires WebRTC implementation which is already present in your previous code."); }
        function rejectCall() { db.ref(`incoming_calls/${myUser}`).remove(); }
        function endCall() { document.getElementById('call-screen').style.display = 'none'; }
        
        function moveTab(i) { currentTab = i; document.getElementById('main-container').style.transform = `translateX(-${i * 33.333}%)`; document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', idx === i)); }
        function renderRequests(data) { /* Implementation exists in original */ }
        function handleFab() { showModal("Add User", `<input id="add-u" placeholder="Username">`, () => { const u = document.getElementById('add-u').value; db.ref('requests/'+myUser+'/'+u).set({type:'sent', status:'pending'}); db.ref('requests/'+u+'/'+myUser).set({type:'received', status:'pending'}); closeModal(); }); }
        function showPrivateRoomMenu() { toggleSidebar(false); }
        function showCallHistory() { toggleSidebar(false); }

        if(!myUser) document.getElementById('login-screen').style.display='flex';
        else { document.getElementById('side-user-info').innerText = "@"+myUser; document.getElementById('my-avatar').innerText = myUser[0]; startApp(); }
    </script>
</body>
</html>
